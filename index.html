<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickers Bendecidos - Monitoreo & Filtros</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'JetBrains Mono', monospace; background-color: #f4f0ea; color: #1a1a1a; }
        .font-pixel { font-family: 'Silkscreen', cursive; }
        
        .responsive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 0.6rem;
        }

        @media (min-width: 640px) {
            .responsive-grid {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                gap: 0.8rem;
            }
        }
        
        /* Card Disponible (Verde) */
        .pixel-card {
            background: #111813;
            border: 2px solid #22c55e;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        /* Card Ganador / Confirmado (Dorado) */
        .pixel-card-gold {
            background: #1c1708;
            border: 2px solid #eab308;
            box-shadow: 0 4px 14px rgba(234, 179, 8, 0.2);
        }

        /* Card Pendiente de Pago (Naranja / Ámbar) */
        .pixel-card-amber {
            background: #241705;
            border: 2px solid #f97316;
            box-shadow: 0 4px 14px rgba(249, 115, 22, 0.25);
        }

        /* Card Aleatorio Reciente (Púrpura) */
        .pixel-card-azar {
            background: #18151f;
            border: 2px solid #a855f7;
            box-shadow: 0 4px 14px rgba(168, 85, 247, 0.2);
        }
    </style>
</head>
<body class="min-h-screen w-screen flex flex-col items-center justify-start p-2 sm:p-4 overflow-x-hidden">

    <div class="w-full max-w-5xl flex flex-col gap-3">
        
        <!-- Header Principal -->
        <header class="flex flex-row justify-between items-center border-2 border-[#1a1a1a] bg-[#eae5dc] p-3 rounded-xl shadow-md">
            <div class="flex items-center gap-2">
                <span class="text-xl">👑</span>
                <h1 class="font-pixel text-base sm:text-xl text-amber-600 tracking-wider">STICKERS BENDECIDOS</h1>
            </div>
            
            <div class="flex items-center gap-1.5 bg-white px-2.5 py-1 rounded-lg border border-[#1a1a1a]">
                <span id="dotStatus" class="w-2 h-2 bg-yellow-500 rounded-full animate-pulse"></span>
                <span id="cloudStatus" class="text-[0.65rem] font-bold text-yellow-700">CONECTANDO...</span>
            </div>
        </header>

        <!-- Barra de Estadísticas Globales -->
        <div class="grid grid-cols-3 gap-2">
            <div class="bg-white border-2 border-[#1a1a1a] p-2 rounded-lg text-center shadow-sm">
                <div class="text-[0.55rem] sm:text-[0.65rem] text-neutral-500 font-bold uppercase">Restantes</div>
                <div id="statRestantes" class="text-base sm:text-lg font-extrabold text-neutral-900">100,000</div>
            </div>
            <div class="bg-white border-2 border-[#1a1a1a] p-2 rounded-lg text-center shadow-sm">
                <div class="text-[0.55rem] sm:text-[0.65rem] text-neutral-500 font-bold uppercase">Vendidos Aprox.</div>
                <div id="statVendidos" class="text-base sm:text-lg font-extrabold text-amber-600">#0</div>
            </div>
            <div class="bg-white border-2 border-[#1a1a1a] p-2 rounded-lg text-center shadow-sm">
                <div class="text-[0.55rem] sm:text-[0.65rem] text-neutral-500 font-bold uppercase">Ganadores</div>
                <div id="statGanadores" class="text-base sm:text-lg font-extrabold text-emerald-600">0</div>
            </div>
        </div>

        <!-- Grid de Cards Responsive -->
        <div id="gridBendecidos" class="responsive-grid">
            <!-- Renderizado base instantáneo -->
        </div>

        <!-- Panel de Filtros & Tabla Histórica -->
        <div class="bg-white border-2 border-[#1a1a1a] rounded-xl p-3 flex flex-col gap-3 shadow-md">
            <div class="text-xs font-bold text-neutral-900 uppercase border-b border-neutral-200 pb-2 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-1">
                <span class="flex items-center gap-1">📊 AUDITORÍA DE VENTAS POR RANGO & HORA</span>
                <span id="countFiltrados" class="text-[0.65rem] text-amber-800 font-extrabold bg-amber-100 px-2.5 py-0.5 rounded border border-amber-300">0 REGISTROS</span>
            </div>

            <!-- Módulo de Filtros en Fondo Negro -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-[#0f1410] p-3 rounded-lg border-2 border-[#1a1a1a] text-[0.7rem]">
                <div>
                    <label class="block text-white font-extrabold mb-1">Buscar Ticket:</label>
                    <input type="text" id="filterTicket" placeholder="ej. 00000" oninput="aplicarFiltrosTabla()" class="w-full bg-[#1b241c] text-white border border-[#22c55e] p-2 rounded outline-none text-xs font-bold placeholder-neutral-400 focus:border-amber-400 focus:bg-[#232f25]">
                </div>

                <div>
                    <label class="block text-white font-extrabold mb-1">Posición Desde (#):</label>
                    <input type="number" id="filterPosMin" placeholder="ej. 0" oninput="aplicarFiltrosTabla()" class="w-full bg-[#1b241c] text-white border border-[#22c55e] p-2 rounded outline-none text-xs font-bold placeholder-neutral-400 focus:border-amber-400 focus:bg-[#232f25]">
                </div>

                <div>
                    <label class="block text-white font-extrabold mb-1">Posición Hasta (#):</label>
                    <input type="number" id="filterPosMax" placeholder="ej. 100000" oninput="aplicarFiltrosTabla()" class="w-full bg-[#1b241c] text-white border border-[#22c55e] p-2 rounded outline-none text-xs font-bold placeholder-neutral-400 focus:border-amber-400 focus:bg-[#232f25]">
                </div>

                <div>
                    <label class="block text-white font-extrabold mb-1">Filtrar Estado:</label>
                    <select id="filterEstado" onchange="aplicarFiltrosTabla()" class="w-full bg-[#1b241c] text-white border border-[#eab308] p-2 rounded outline-none text-xs font-bold cursor-pointer focus:border-amber-400">
                        <option value="todos" class="bg-[#1b241c] text-white">Todos los Estados</option>
                        <option value="confirmado" class="bg-[#1b241c] text-emerald-400 font-bold">Confirmados</option>
                        <option value="pendiente" class="bg-[#1b241c] text-amber-400 font-bold">Pendientes</option>
                        <option value="disponible" class="bg-[#1b241c] text-neutral-300">Disponibles</option>
                    </select>
                </div>
            </div>

            <!-- Tabla de Resultados -->
            <div class="overflow-x-auto max-h-64 overflow-y-auto border-2 border-[#1a1a1a] rounded-lg">
                <table class="w-full text-left border-collapse text-[0.7rem]">
                    <thead class="bg-neutral-900 text-white sticky top-0 uppercase text-[0.65rem] tracking-wider">
                        <tr>
                            <th class="p-2 border-b border-neutral-700">Fecha / Hora</th>
                            <th class="p-2 border-b border-neutral-700">Ticket</th>
                            <th class="p-2 border-b border-neutral-700">Transición</th>
                            <th class="p-2 border-b border-neutral-700">Posición Venta</th>
                            <th class="p-2 border-b border-neutral-700">Libres Restantes</th>
                        </tr>
                    </thead>
                    <tbody id="tablaHistorial">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-neutral-500 font-bold">Sin eventos registrados aún.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Footer -->
        <footer class="bg-white border-2 border-[#1a1a1a] p-2.5 rounded-xl flex justify-between items-center text-[0.65rem] sm:text-xs font-bold text-neutral-700 shadow-sm">
            <span>🟢 ESTADO EN TIEMPO REAL</span>
            <span id="txtUltimaHora">--:--:--</span>
        </footer>

    </div>

    <!-- Firebase Firestore SDK (Sin Auth) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtbggGMavu10FkdNzGTiwQDA4sUohh7Q8",
            authDomain: "app-coreano.firebaseapp.com",
            projectId: "app-coreano",
            storageBucket: "app-coreano.firebasestorage.app",
            messagingSenderId: "26159454746",
            appId: "1:26159454746:web:0738142d8df8a402958fa3",
            measurementId: "G-ER5CHMN50K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const LISTA_BENDECIDOS = ["00000", "11111", "22222", "33333", "44444", "55555", "66666", "77777"];
        const PREMIOS = {
            "00000": "IPHONE",
            "11111": "RD$50,000",
            "22222": "IPHONE",
            "33333": "RD$25,000",
            "44444": "IPHONE",
            "55555": "RD$50,000",
            "66666": "IPHONE",
            "77777": "RD$25,000"
        };

        let eventosGlobales = [];

        // Dibuja las tarjetas inmediatamente al cargar el documento
        function renderizarBase() {
            const container = document.getElementById('gridBendecidos');
            container.innerHTML = "";
            LISTA_BENDECIDOS.forEach(num => {
                const card = document.createElement('div');
                card.className = "pixel-card p-2.5 rounded-lg flex flex-col justify-between items-center text-center gap-1 text-green-400";
                card.innerHTML = `
                    <div class="flex items-center gap-1 text-[0.55rem] font-bold uppercase tracking-wide text-neutral-400">
                        <span>🎁</span><span>DISPONIBLE</span>
                    </div>
                    <div class="text-xl sm:text-2xl font-extrabold tracking-wider text-white">${num}</div>
                    <div class="text-[0.6rem] font-bold text-emerald-300 bg-[#080d09] px-1.5 py-0.5 rounded border border-[#15803d] w-full truncate">#--</div>
                    <div class="text-[0.55rem] font-extrabold tracking-wide uppercase text-neutral-300 pt-0.5 border-t border-neutral-700 w-full truncate">${PREMIOS[num]}</div>
                `;
                container.appendChild(card);
            });
        }
        renderizarBase();

        function escucharFirestoreDirecto() {
            const refDoc = doc(db, "rifa_estado", "actual");
            
            onSnapshot(refDoc, (snap) => {
                document.getElementById('cloudStatus').innerText = "EN VIVO";
                document.getElementById('cloudStatus').className = "text-[0.65rem] font-bold text-green-700";
                document.getElementById('dotStatus').className = "w-2 h-2 bg-green-500 rounded-full animate-pulse";

                if (snap.exists()) {
                    const data = snap.data();
                    eventosGlobales = data.eventos || [];
                    renderizarBendecidos(data);
                    aplicarFiltrosTabla();
                }
            }, (error) => {
                console.error("Error al escuchar Firestore:", error);
                document.getElementById('cloudStatus').innerText = "ERROR";
                document.getElementById('cloudStatus').className = "text-[0.65rem] font-bold text-red-600";
            });
        }

        function renderizarBendecidos(data) {
            const boletosObj = data.boletos || {};
            const ultimoAzar = data.ultimoAleatorio || null;

            document.getElementById('statRestantes').innerText = data.disponiblesGlobal !== undefined ? Number(data.disponiblesGlobal).toLocaleString() : "100,000";
            document.getElementById('statVendidos').innerText = data.vendidosGlobal !== undefined ? `#${Number(data.vendidosGlobal).toLocaleString()}` : "#0";

            const container = document.getElementById('gridBendecidos');
            container.innerHTML = "";

            let ganadoresCount = 0;

            LISTA_BENDECIDOS.forEach(num => {
                const b = boletosObj[num] || {};
                const estado = b.resultado || "disponible";
                const esGanador = estado === "confirmado";
                const esPendiente = estado === "pendiente";

                if (esGanador) ganadoresCount++;

                const posStr = b.posicionAprox ? `#${Number(b.posicionAprox).toLocaleString()}` : "#--";
                const premioStr = PREMIOS[num] || "BONO";

                // Definición visual según el estado del boleto
                let cardStyle = "pixel-card p-2.5 rounded-lg flex flex-col justify-between items-center text-center gap-1 text-green-400";
                let iconHeader = "🎁";
                let textHeader = "DISPONIBLE";
                let textHeaderColor = "text-neutral-400";
                let numberColor = "text-white";
                let badgePosStyle = "text-emerald-300 bg-[#080d09] border-[#15803d]";
                let premioColor = "text-neutral-300";

                if (esGanador) {
                    cardStyle = "pixel-card-gold p-2.5 rounded-lg flex flex-col justify-between items-center text-center gap-1 text-amber-200";
                    iconHeader = "🏆";
                    textHeader = "GANADOR";
                    textHeaderColor = "text-yellow-400";
                    numberColor = "text-yellow-300";
                    badgePosStyle = "text-yellow-300 bg-[#171305] border-[#a16207]";
                    premioColor = "text-yellow-400";
                } else if (esPendiente) {
                    cardStyle = "pixel-card-amber p-2.5 rounded-lg flex flex-col justify-between items-center text-center gap-1 text-amber-300";
                    iconHeader = "⏳";
                    textHeader = "PENDIENTE PAGO";
                    textHeaderColor = "text-orange-400 font-extrabold";
                    numberColor = "text-orange-300";
                    badgePosStyle = "text-orange-300 bg-[#1a0f03] border-[#c2410c]";
                    premioColor = "text-orange-400";
                }

                const card = document.createElement('div');
                card.className = cardStyle;

                card.innerHTML = `
                    <div class="flex items-center gap-1 text-[0.55rem] font-bold uppercase tracking-wide ${textHeaderColor}">
                        <span>${iconHeader}</span>
                        <span class="truncate">${textHeader}</span>
                    </div>

                    <div class="text-xl sm:text-2xl font-extrabold tracking-wider ${numberColor}">
                        ${num}
                    </div>

                    <div class="text-[0.6rem] font-bold px-1.5 py-0.5 rounded border w-full truncate ${badgePosStyle}">
                        ${posStr}
                    </div>

                    <div class="text-[0.55rem] font-extrabold tracking-wide uppercase ${premioColor} pt-0.5 border-t border-neutral-700 w-full truncate">
                        ${premioStr}
                    </div>
                `;
                container.appendChild(card);
            });

            if (ultimoAzar) {
                const bAzar = boletosObj[ultimoAzar] || {};
                const estadoAzar = bAzar.resultado || "disponible";
                const posAzarStr = bAzar.posicionAprox ? `#${Number(bAzar.posicionAprox).toLocaleString()}` : "#--";

                let estadoEstilo = "text-purple-300";
                if (estadoAzar === "confirmado") estadoEstilo = "text-emerald-400";
                if (estadoAzar === "pendiente") estadoEstilo = "text-amber-400";

                const cardAzar = document.createElement('div');
                cardAzar.className = "pixel-card-azar p-2.5 rounded-lg flex flex-col justify-between items-center text-center gap-1 text-purple-300";

                cardAzar.innerHTML = `
                    <div class="flex items-center gap-1 text-[0.55rem] font-bold uppercase tracking-wide text-purple-400">
                        <span>🎲</span>
                        <span class="truncate">${estadoAzar.toUpperCase()}</span>
                    </div>

                    <div class="text-xl sm:text-2xl font-extrabold tracking-wider text-purple-200">
                        ${ultimoAzar}
                    </div>

                    <div class="text-[0.6rem] font-bold text-purple-300 bg-[#120b1c] px-1.5 py-0.5 rounded border border-[#6b21a8] w-full truncate">
                        ${posAzarStr}
                    </div>

                    <div class="text-[0.55rem] font-extrabold tracking-wide uppercase ${estadoEstilo} pt-0.5 border-t border-purple-900 w-full truncate">
                        🎲 ALEATORIO RECIENTE
                    </div>
                `;
                container.appendChild(cardAzar);
            }

            document.getElementById('statGanadores').innerText = ganadoresCount;
            document.getElementById('txtUltimaHora').innerText = "Act: " + new Date().toLocaleTimeString();
        }

        window.aplicarFiltrosTabla = function() {
            const ticketQuery = document.getElementById('filterTicket').value.trim();
            const posMin = document.getElementById('filterPosMin').value !== "" ? Number(document.getElementById('filterPosMin').value) : null;
            const posMax = document.getElementById('filterPosMax').value !== "" ? Number(document.getElementById('filterPosMax').value) : null;
            const estadoSel = document.getElementById('filterEstado').value;

            const tbody = document.getElementById('tablaHistorial');
            tbody.innerHTML = "";

            const filtrados = eventosGlobales.filter(ev => {
                if (ticketQuery && !ev.boleto.includes(ticketQuery)) return false;
                if (estadoSel !== "todos" && ev.estado !== estadoSel) return false;

                const pos = (ev.vendidos !== undefined && ev.vendidos !== null) ? Number(ev.vendidos) : null;
                if (posMin !== null && (pos === null || pos < posMin)) return false;
                if (posMax !== null && (pos === null || pos > posMax)) return false;

                return true;
            });

            document.getElementById('countFiltrados').innerText = `${filtrados.length} REGISTROS`;

            if (filtrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-neutral-500 font-bold">Sin eventos registrados aún.</td></tr>`;
                return;
            }

            filtrados.slice().reverse().forEach(ev => {
                const fechaObj = ev.detectado ? new Date(ev.detectado) : null;
                const horaStr = fechaObj ? `${fechaObj.toLocaleDateString()} ${fechaObj.toLocaleTimeString()}` : "N/A";
                const posStr = ev.vendidos ? `#${Number(ev.vendidos).toLocaleString()}` : "N/A";
                const libresStr = ev.disponibles ? Number(ev.disponibles).toLocaleString() : "N/A";

                let badgeEstado = "bg-neutral-100 text-neutral-800 border border-neutral-400 font-bold";
                if (ev.estado === "confirmado") badgeEstado = "bg-emerald-100 text-emerald-900 border border-emerald-400 font-extrabold";
                if (ev.estado === "pendiente") badgeEstado = "bg-amber-100 text-amber-900 border border-amber-400 font-extrabold";

                const tr = document.createElement('tr');
                tr.className = "border-b border-neutral-200 hover:bg-neutral-100 transition-colors";
                tr.innerHTML = `
                    <td class="p-2 text-neutral-800 font-semibold">${horaStr}</td>
                    <td class="p-2 font-extrabold text-neutral-900">${ev.boleto}</td>
                    <td class="p-2">
                        <span class="text-[0.6rem] text-neutral-500 mr-1">${ev.anterior || 'inicio'} ➔</span>
                        <span class="px-1.5 py-0.5 rounded uppercase text-[0.6rem] ${badgeEstado}">${ev.estado}</span>
                    </td>
                    <td class="p-2 font-bold text-emerald-800">${posStr}</td>
                    <td class="p-2 text-neutral-700 font-medium">${libresStr}</td>
                `;
                tbody.appendChild(tr);
            });
        };

        escucharFirestoreDirecto();
    </script>
</body>
</html>
